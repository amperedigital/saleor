server {
    listen 80;
    server_name localhost;
    index index.html;               ← add this

    # point root at the parent of your dashboard folder
    root /usr/share/nginx/html;

    # ensure /dashboard → /dashboard/
    location = /dashboard {
        return 301 /dashboard/;
    }

    # serve dashboard SPA
    location /dashboard/ {
        try_files $uri $uri/ /dashboard/index.html;
        index index.html;
    }

    # serve assets with proper MIME types
    location ~* \.(js|mjs)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Type application/javascript;
    }
    location ~* \.css$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Type text/css;
    }

    # error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
