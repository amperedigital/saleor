server {
    listen 80;
    server_name localhost;

    root /app/dashboard;
    index index.html;

    # Static files (JS, CSS, fonts, etc.)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|json|webmanifest)$ {
        access_log off;
        expires max;
        try_files $uri =404;
    }

    # Main dashboard route with SPA support
    location /dashboard/ {
        try_files $uri $uri/ /index.html;
    }

    # Support clean URLs like /apps/, /orders/
    location / {
        try_files $uri /index.html;
    }
}
